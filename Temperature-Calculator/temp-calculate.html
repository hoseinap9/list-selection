<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
</head>
<body>
    <div class="containor">
        <h1>
            Temperature Converter
        </h1>
        
            <div class="TemperatureSection">
                <Label for="Celecius">Celecius:</Label>
                <input id="Celecius" onchange="calculateTemp(event)" name="Celecius" class="tempInput" type="number" placeholder="Enter Temperature">    
            </div>
            <div class="TemperatureSection">
                <Label for="Farenheit">Farenheit:</Label>
                <input id="Farenheit" onchange="calculateTemp(event)" name="Farenheit" class="tempInput" type="number" placeholder="Enter Temperature">    
            </div>
            <div class="TemperatureSection">
                <Label for="Kelvin">Kelvin:</Label>
                <input id="Kelvin" onchange="calculateTemp(event)" name="Kelvin" class="tempInput" type="number" placeholder="Enter Temperature">    
            </div>
              
    </div>
    <script src="inex.js"></script>
</body>
</html>
